name: RXE serial compatibility compile-only matrix
on:
  push:
    branches: [qa/rxe-header-compile-20261020]
permissions:
  contents: read
concurrency:
  group: rxe-header-compile-only
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'xue-ding-e/valkey' && github.ref == 'refs/heads/qa/rxe-header-compile-20261020' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check host tools without installing anything
        shell: bash
        run: |
          set -euo pipefail
          echo 'HOST ONLY (not the compile target):'
          uname -a
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          for tool in python3 gpgv dpkg-deb gcc-13 make ld ldd; do command -v "$tool"; done
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          gcc-13 --version
          dpkg-query -W libc6 libdw1t64 libelf1t64 libssl3t64 zlib1g coreutils
      - name: Authenticate and extract exact target headers
        run: timeout 180s python3 .github/scripts/prepare_headers.py
      - name: Authenticate and extract exact old control headers
        run: timeout 180s python3 .github/scripts/prepare_old_headers.py
      - name: Fetch pinned RXE source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: pizhenwei/rxe
          ref: cdcd539ade4e2797bcc4da9161a26feca997a9a4
          path: rxe
          persist-credentials: false
      - name: Serial real-header baseline and candidate matrix
        env:
          CC: gcc-13
        run: timeout 600s python3 .github/scripts/run_matrix.py
