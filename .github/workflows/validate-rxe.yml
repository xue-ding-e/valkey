name: RXE authenticated header compile-only validation
on:
  push:
    branches: [qa/rxe-header-compile-20261020]
permissions:
  contents: read
concurrency:
  group: rxe-header-compile-only
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'xue-ding-e/valkey' && github.ref == 'refs/heads/qa/rxe-header-compile-20261020' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check host tools without installing anything
        shell: bash
        run: |
          set -euo pipefail
          echo 'HOST ONLY (not the compile target):'
          uname -a
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          for tool in python3 gpgv dpkg-deb gcc-13 make ld ldd; do command -v "$tool"; done
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          gcc-13 --version
          dpkg-query -W libc6 libdw1t64 libelf1t64 libssl3t64 zlib1g coreutils
      - name: Authenticate and extract exact target headers
        run: timeout 180s python3 .github/scripts/prepare_headers.py
      - name: Fetch pinned RXE source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: pizhenwei/rxe
          ref: cdcd539ade4e2797bcc4da9161a26feca997a9a4
          path: rxe
          persist-credentials: false
      - name: Reproduce baseline compiler failure without loading a module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rxe rev-parse HEAD)" = 'cdcd539ade4e2797bcc4da9161a26feca997a9a4'
          echo 'TARGET: authenticated Ubuntu 7.0.0-1017.17~24.04.1 headers'
          cat "$RXE_HEADERS/include/config/kernel.release"
          grep -n -A2 -B2 'setup_udp_tunnel_sock\|udp_tunnel_sock_release' "$RXE_HEADERS/include/net/udp_tunnel.h"
          set +e
          timeout 300s make -j2 -C "$RXE_HEADERS" M="$GITHUB_WORKSPACE/rxe" CC=gcc-13 modules > baseline.log 2>&1
          status=$?
          set -e
          cat baseline.log
          test "$status" -ne 0
          test "$status" -ne 124
          grep -F 'setup_udp_tunnel_sock' baseline.log
          grep -F 'incompatible pointer type' baseline.log
          grep -F 'struct socket *' baseline.log
          grep -F 'struct sock *' baseline.log
          echo 'EXPECTED_BASELINE_RED: incompatible RXE UDP setup signature reproduced; no candidate tested.'
