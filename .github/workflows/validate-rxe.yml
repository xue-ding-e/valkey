name: RXE pinned upstream snapshot old-header RED validation
on:
  push:
    branches: [qa/rxe-header-compile-20261020]
permissions:
  contents: read
concurrency:
  group: rxe-header-compile-only
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'xue-ding-e/valkey' && github.ref == 'refs/heads/qa/rxe-header-compile-20261020' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check host tools without installing anything
        shell: bash
        run: |
          set -euo pipefail
          echo 'HOST ONLY (not the compile target):'
          uname -a
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          for tool in python3 gpgv dpkg-deb gcc-13 make ld ldd; do command -v "$tool"; done
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          gcc-13 --version
          dpkg-query -W libc6 libdw1t64 libelf1t64 libssl3t64 zlib1g coreutils
      - name: Authenticate and extract exact target headers
        run: timeout -k 10s 180s python3 .github/scripts/prepare_old_headers.py
      - name: Fetch pinned RXE source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: pizhenwei/rxe
          ref: f855356f373337c5e482fd487030e58778d6aaac
          path: rxe
          persist-credentials: false
      - name: Reproduce old-header compile failure without loading a module
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          test "$(git -C rxe rev-parse HEAD)" = 'f855356f373337c5e482fd487030e58778d6aaac'
          echo 'TARGET: authenticated Ubuntu 6.17.0-1022.22 headers; host kernel is not the compile target'
          test "$(cat "$RXE_OLD_HEADERS/include/config/kernel.release")" = '6.17.0-1022-azure'
          timeout -k 10s 180s python3 .github/scripts/probe_api.py "$RXE_OLD_HEADERS" 6.17.0-1022-azure
          set +e
          timeout -k 10s 300s make -j2 -C "$RXE_OLD_HEADERS" M="$GITHUB_WORKSPACE/rxe" CC=gcc-13 modules > upstream-old-build.log 2>&1
          status=$?
          set -e
          cat upstream-old-build.log
          echo "UPSTREAM_OLD_BUILD_EXIT=$status"
          test "$status" -eq 2
          test ! -e rxe/rdma_rxe.ko
          python3 - <<'PYCLASSIFY'
          import pathlib, re
          text = pathlib.Path('upstream-old-build.log').read_text()
          errors = [line for line in text.splitlines() if re.search(r'\berror:', line)]
          assert errors, 'BLOCKED: no compiler error diagnostic; not the expected RED'
          assert all('rxe_queue.c:66:' in line and 'implicit declaration of function' in line and 'kzalloc_obj' in line and '[-Werror=implicit-function-declaration]' in line for line in errors), errors
          assert 'q = kzalloc_obj(*q);' in text, 'BLOCKED: missing source diagnostic'
          print('EXPECTED_COMPILE_RED: pinned f855356 fails on exact 6.17 headers at kzalloc_obj. Workflow success means reproduced failure, not successful RXE build. No installation, load, runtime, performance, or snapshot-selection validation.')
          PYCLASSIFY
