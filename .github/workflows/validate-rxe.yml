name: RXE upstream snapshot exact-header compile-only validation
on:
  push:
    branches: [qa/rxe-header-compile-20261020]
permissions:
  contents: read
concurrency:
  group: rxe-header-compile-only
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'xue-ding-e/valkey' && github.ref == 'refs/heads/qa/rxe-header-compile-20261020' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check host tools without installing anything
        shell: bash
        run: |
          set -euo pipefail
          echo 'HOST ONLY (not the compile target):'
          uname -a
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          for tool in python3 gpgv dpkg-deb gcc-13 make ld ldd; do command -v "$tool"; done
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          gcc-13 --version
          dpkg-query -W libc6 libdw1t64 libelf1t64 libssl3t64 zlib1g coreutils
      - name: Authenticate and extract exact target headers
        run: timeout -k 10s 180s python3 .github/scripts/prepare_headers.py
      - name: Fetch pinned RXE source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: pizhenwei/rxe
          ref: f855356f373337c5e482fd487030e58778d6aaac
          path: rxe
          persist-credentials: false
      - name: Validate upstream snapshot without loading a module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rxe rev-parse HEAD)" = 'f855356f373337c5e482fd487030e58778d6aaac'
          echo 'TARGET: authenticated Ubuntu 7.0.0-1017.17~24.04.1 headers; no 6.17 compatibility claim'
          test "$(cat "$RXE_HEADERS/include/config/kernel.release")" = '7.0.0-1017-azure'
          timeout -k 10s 180s python3 .github/scripts/probe_api.py "$RXE_HEADERS" 7.0.0-1017-azure
          set +e
          timeout -k 10s 300s make -j2 -C "$RXE_HEADERS" M="$GITHUB_WORKSPACE/rxe" CC=gcc-13 modules > upstream-build.log 2>&1
          status=$?
          set -e
          cat upstream-build.log
          echo "UPSTREAM_BUILD_EXIT=$status"
          test "$status" -eq 0
          test -s rxe/rdma_rxe.ko
          sha256sum rxe/rdma_rxe.ko
          echo 'UPSTREAM_COMPILE_GREEN: exact source and headers only; no module installation/load, runtime or performance tests; see log for BTF/pahole warnings.'
