name: Isolated DEBUG loading replication regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valkey-loading-regression-20261028
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'xue-ding-e/valkey' && github.ref == 'refs/heads/qa/loading-regression-20261028' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated validation controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
      - name: Checkout exact official source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: valkey-io/valkey
          ref: f2ca837edc75e2238f880d89ade60babb6e6ed9e
          path: v
          persist-credentials: false
      - name: Serial bounded build and real replication suite
        run: python3 qa/.github/scripts/validate-loading.py
